name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    - name: Verify mode and UI imports
      shell: pwsh
      run: |
        @'
        from modes import load_builtin_modes, list_modes
        from core.spectrum import SpectrumAnalyzer
        from ui.settings_window import SettingsWindow
        from ui.monitor_manager import MonitorManager
        load_builtin_modes()
        expected = {'bars', 'wave', 'mirror', 'dot_matrix', 'skyline'}
        actual = {mode['id'] for mode in list_modes()}
        assert expected <= actual, f'Missing modes: {expected - actual}'
        print('Modes and UI imports OK')
        '@ | python -
